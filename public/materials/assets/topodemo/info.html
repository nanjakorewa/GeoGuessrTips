<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>待機・休憩・終了 | 地形図テーマ</title>
<link rel="stylesheet" href="_map.css">
<style>
  .center { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:30px; z-index:5; }
  .card { background:var(--panel); border:3px solid var(--panel-line); padding:46px 96px;
    text-align:center; box-shadow:0 16px 40px rgba(60,50,30,.22); position:relative; }
  .card::after { content:""; position:absolute; inset:9px; border:1px solid var(--panel-line); opacity:.5; }
  .eyebrow { font-size:22px; letter-spacing:.4em; color:var(--note); margin-bottom:16px; }
  .headline { font-family:var(--map-font); font-size:76px; letter-spacing:.22em; }
  .sub { font-size:24px; color:#5b5b5b; margin-top:18px; letter-spacing:.14em; }
  .foot { position:absolute; left:50px; right:50px; bottom:44px;
    display:flex; align-items:flex-end; justify-content:space-between; }
  .coord { font-family:var(--map-font); font-size:20px; letter-spacing:.12em; color:#4a4a4a; }
</style>
</head>
<body data-pagefind-ignore>
<div id="map" class="drift"></div>
<div class="haze"></div>
<div class="neatline"></div>

<div class="center">
  <div class="card">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="headline place" id="headline"></div>
    <div class="sub" id="sub"></div>
  </div>
</div>


<div class="foot">
  <div class="scalebar"><i></i><i></i><i></i><i></i><span style="margin-left:10px">500m</span></div>
  <div class="coord" id="coord"></div>
  <div class="north">N<br><svg width="26" height="42" viewBox="0 0 26 42"><path d="M13,2 L21,38 L13,30 L5,38 Z" fill="var(--ink)"/></svg></div>
</div>

<script src="_map.js"></script>
<script>
/* ============ ここを編集して自分好みにできます ============
   URLの ?mode= で表示を切り替えます
     ?mode=start … 待機 / ?mode=break … 休憩 / ?mode=end … 終了
   ======================================================== */
var MODES = {
  start: { eyebrow:"STARTING SOON", headline:"まもなく出発", sub:"準備をしています。すこしお待ちください" },
  break: { eyebrow:"REST POINT",    headline:"小休止",     sub:"5分ほどで戻ります" },
  end:   { eyebrow:"GOAL",          headline:"下山しました", sub:"今日もありがとうございました" }
};
var COORD = "N 34°54′  E 139°05′";   // 画面右下に出る座標風の文字
var MAP_SEED = { start: 7, break: 23, end: 41 };  // 地形の形（数字を変えると地形が変わります）
/* ======================================================== */

var mode = (location.search.match(/mode=(\w+)/) || [])[1] || "start";
var M = MODES[mode] || MODES.start;
document.getElementById("eyebrow").textContent = M.eyebrow;
document.getElementById("headline").textContent = M.headline;
document.getElementById("sub").textContent = M.sub;
document.getElementById("coord").textContent = COORD;

var NS = "http://www.w3.org/2000/svg";
var svg = document.createElementNS(NS, "svg");
svg.setAttribute("viewBox", "0 0 1920 1080");
svg.setAttribute("width", 1920); svg.setAttribute("height", 1080);
document.getElementById("map").appendChild(svg);
drawTopoMap(svg, 1920, 1080, {seed: MAP_SEED[mode] || 7, hills: 12, peakX: 0.5, peakY: 0.44});

</script>

<div id="wm">SAMPLE</div>
<style>
  #wm { position:absolute; inset:0; z-index:99; pointer-events:none;
    display:flex; align-items:center; justify-content:center; flex-wrap:wrap;
    font:700 84px/2.6 "Segoe UI",sans-serif; letter-spacing:.4em;
    color:rgba(90,75,45,.13); transform:rotate(-16deg) scale(1.5); word-spacing:2em; }
</style>
</body>
</html>
