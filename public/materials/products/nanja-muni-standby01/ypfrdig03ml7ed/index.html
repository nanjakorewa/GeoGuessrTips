<!DOCTYPE html>
<html lang="ja" data-pagefind-ignore>
<head>
<meta charset="UTF-8">
<!-- 検索エンジンに載せないページです（サイト内検索・sitemapからも除外） -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>市区町村ランダム待機画面 | nanja素材</title>
<link rel="stylesheet" href="_standby.css">
<style>html, body { margin: 0; overflow: hidden; }</style>
</head>
<body>

<div id="topo" class="drift"></div>
<div class="haze"></div>
<div class="neatline"></div>

<div id="head">
  <span class="badge" id="headText"></span>
  <span class="en" id="headEn"></span>
</div>
<div id="meta"></div>

<div class="card">
  <div class="mapbox">
    <div id="mapWrap" class="fade" style="width:100%;height:100%"></div>
  </div>
  <div class="rule"></div>
  <div class="textbox">
    <span class="pref fade" id="prefName"></span>
    <span class="name fade" id="muniName"></span>
  </div>
</div>

<div id="foot">
  <div class="note" id="footNote"></div>
  <div class="north">N<br><svg width="22" height="34" viewBox="0 0 26 42"><path d="M13,2 L21,38 L13,30 L5,38 Z" fill="#1b1b1b"/></svg></div>
</div>
<div id="bar"><i id="barFill"></i></div>

<script src="_topo.js"></script>
<script src="../yjyhy7piy9/_muni-data.js"></script>
<script src="_standby.js"></script>
<script>
/* ===========================================================
   OBSのブラウザソースに入れたURLの「?」以降で見た目を変えられます。
   例) ?h=休憩中&he=BE RIGHT BACK&f=&i=8&bar=0
   外部への送信は一切ありません。表示に使うだけです。
   =========================================================== */
(function () {
  "use strict";
  var q = new URLSearchParams(window.location.search);
  function text(key, def, max) {
    if (!q.has(key)) return def;
    return String(q.get(key)).slice(0, max);
  }
  function num(key, def, min, max) {
    var v = parseFloat(q.get(key));
    if (!isFinite(v)) return def;
    return Math.min(max, Math.max(min, v));
  }
  function flag(key, def) {
    if (!q.has(key)) return def;
    var v = q.get(key);
    return !(v === "0" || v === "false" || v === "no");
  }
  buildStandby({
    heading:   text("h",  "まもなく開始", 24),
    headingEn: text("he", "STARTING SOON", 32),
    foot:      text("f",  "配信の準備をしています", 60),
    interval:  num("i", 12, 3, 600),
    seed:      num("seed", 21, 1, 9999),
    bar:       flag("bar", true)
  });
})();
</script>
</body>
</html>
